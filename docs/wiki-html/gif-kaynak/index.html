<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>Telemetry pipeline — GIF</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1280px; height:420px; overflow:hidden; background:#00102E; }
      body { font-family:"Inter",sans-serif; -webkit-font-smoothing:antialiased; }
      #bg { position:absolute; inset:0; background:linear-gradient(155deg,#00102E 0%,#001B3F 100%); }
      #grid { position:absolute; inset:0; opacity:.28;
        background-image:linear-gradient(#093159 1px,transparent 1px),linear-gradient(90deg,#093159 1px,transparent 1px);
        background-size:80px 80px; }
      .stage { position:absolute; top:118px; width:196px; height:150px; border-radius:20px;
        background:#0A2447; border:3px solid #1B4570; padding:18px 14px; text-align:center; }
      .st { font-size:23px; font-weight:700; color:#E4F0EE; line-height:1.2; }
      .ss { font-size:17px; color:#93AEC7; margin-top:8px; line-height:1.3; }
      /* Paket şeridi kutuların ALTINDA ayrı bir hat — üstünden geçerse
         kutu yazılarını kapatıyor (text_occluded). */
      .wire { position:absolute; top:326px; height:3px; background:#123A63; }
      #packet { position:absolute; top:318px; left:128px; width:20px; height:20px; border-radius:50%;
        background:#00CAD7; box-shadow:0 0 18px 5px rgba(0,202,215,.65); }
      #title { position:absolute; left:44px; top:38px; font-size:30px; font-weight:800; color:#E4F0EE; }
      #tsub  { position:absolute; left:44px; top:78px; font-size:20px; color:#93AEC7; }
      #stamp { position:absolute; right:44px; top:44px; font-size:20px; font-weight:700; color:#00CAD7; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6"
         data-width="1280" data-height="420" data-fps="15">
      <div id="bg"><div id="grid"></div></div>

      <div id="title">Telemetry Pipeline</div>
      <div id="tsub">A report every 60 seconds — without GPS hardware</div>
      <div id="stamp">±19 m</div>

      <div class="wire" style="left:138px;width:960px"></div>

      <div class="stage" id="g1" style="left:40px">
        <div class="st">NarRTOS<br />device</div><div class="ss">health data</div>
      </div>
      <div class="stage" id="g2" style="left:280px">
        <div class="st">WiFi<br />scan</div><div class="ss">BSSID + RSSI</div>
      </div>
      <div class="stage" id="g3" style="left:520px">
        <div class="st">Backend</div><div class="ss">HTTP POST<br />fire-and-forget</div>
      </div>
      <div class="stage" id="g4" style="left:760px">
        <div class="st">Location<br />fix</div><div class="ss">Ichnaea-compatible</div>
      </div>
      <div class="stage" id="g5" style="left:1000px">
        <div class="st">Message<br />queue</div><div class="ss">live · location</div>
      </div>

      <div id="packet"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      /* Paket 5 durağı sırayla geziyor; her varışta durak turkuaza dönüp
         sönüyor. 6 sn sonunda paket başlangıç noktasına döner → GIF kesintisiz
         döngü yapar. */
      /* Konum transform (x) ile sürülüyor: `left` kare-kare yakalamada tam
         piksele oturup titriyor (gsap_non_transform_motion). */
      const X = [0, 240, 480, 720, 960];
      const HOT = { borderColor: "#00CAD7", backgroundColor: "#00364F", duration: .18 };
      const COLD = { borderColor: "#1B4570", backgroundColor: "#0A2447", duration: .3 };

      for (let i = 0; i < 5; i++) {
        const t = i * 1.1;
        if (i > 0) tl.to("#packet", { x: X[i], duration: .55, ease: "power2.inOut" }, t - .55);
        tl.to("#g" + (i + 1), HOT, t);
        tl.to("#g" + (i + 1), COLD, t + .55);
      }
      /* dönüş: son duraktan başa süzül */
      tl.to("#packet", { x: X[0], duration: .8, ease: "power2.inOut" }, 5.0);
      tl.fromTo("#packet", { opacity: 1 }, { opacity: .15, duration: .4, yoyo: true, repeat: 1 }, 5.0);
    </script>
  </body>
</html>
