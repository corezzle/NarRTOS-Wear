; ============================================================
; Embedded Wearable OS - PlatformIO Configuration
; Target: ESP32-S3R8 + 32MB Flash + 8MB PSRAM
; ============================================================

[env:esp32s3_wearable]
; v1.2.9 (2026-08-19): sürüm pinlendi — pinsizken başka makinede registry
; 7.0.1'i çekip "UnknownPlatform" veriyordu (core uyumsuzluğu). 6.13.0 =
; bu projenin bilinen-iyi sürümü.
platform  = espressif32@6.13.0
board     = esp32-s3-devkitc-1
framework = espidf

; --- Flash & PSRAM ---
board_build.flash_size        = 8MB
board_build.flash_mode        = qio
board_build.flash_freq        = 80m
board_build.psram_type        = opi

; --- Partition Table ---
board_build.partitions = partitions_custom.csv

; --- Upload ---
upload_protocol = esptool
upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize

; --- Build Flags ---
build_flags =
    ; Core & PSRAM
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_CAPS_ALLOC=1
    -DCONFIG_SPIRAM_CACHE_WORKAROUND=1

    ; CPU Speed — sdkconfig.defaults artık 240 MHz handle ediyor; build flag
    ; auto-defined macro ile çakışıyordu (ESP-IDF redefined warning → -Werror).

    ; LVGL: sadece config dosyasını bul, geri her şey lv_conf.h'da
    -DLV_CONF_INCLUDE_SIMPLE

    ; Display geometry
    -DDISPLAY_WIDTH=410
    -DDISPLAY_HEIGHT=502
    ; v1.4.55 (2026-05-19): Audit #6 fix uygulanırken bulunan stale override.
    ; -DDISPLAY_BUF_LINES=60 kaldırıldı; os_config.h:192 artık authoritative
    ; (target=80, ladder 80→60→40→20→10→8). Build flag #ifndef guard'ı
    ; bypass ediyordu → os_config.h değişikliği etkisizdi.

    ; Dual-core pinning
    -DUI_TASK_CORE=0
    -DSENSOR_TASK_CORE=1
    -DUI_TASK_PRIORITY=5
    -DSENSOR_TASK_PRIORITY=4
    -DPOWER_TASK_PRIORITY=6

    ; Feature flags
    -DENABLE_BLE=1
    -DENABLE_STEP_COUNTER=1
    -DENABLE_DEEP_SLEEP=1

    ; Disable ARM-specific SIMD (ESP32-S3 is Xtensa, not ARM Cortex-M)
    -DLV_DRAW_SW_ASM_HELIUM=0
    -DLV_DRAW_SW_ASM_NEON=0

    ; Debug
    -DCORE_DEBUG_LEVEL=3

    ; lv_conf.h için include path (LVGL kütüphanesi bu path'i arar)
    -I${PROJECT_INCLUDE_DIR}
    ; LVGL headers for generated fonts
    -I.pio/libdeps/esp32s3_wearable/lvgl

; --- Extra Scripts ---
extra_scripts = pre:scripts/remove_arm_asm.py

; --- Dependencies ---
lib_deps =
    lvgl/lvgl @ ~9.2.0


; ============================================================
; Alternate Display Variant — SH8601 1.8" panel (368x448)
; ============================================================
;
; Aynı ESP32-S3 board, sadece display'i 1.8" (368x448) SH8601 paneli
; ile değişebilir. Build:
;   pio run -e esp32s3_18inch -t upload
;
; Mevcut `esp32s3_wearable` env'i tek satır bile değişmiyor; bu env
; ondan extends ile miras alır, sadece:
;   1. build_src_filter ile co5300_driver.cpp'yi devreden çıkarır,
;      sh8601_18_driver.cpp'yi derler (aynı fonksiyon isimleri → linker
;      tek `co5300_*` set'i görür).
;   2. CO5300_H_RES / CO5300_V_RES build flag ile 368/448 override eder
;      (co5300_driver.h #ifndef guard sayesinde geçer).
;
; Pin map S3 board ile aynı (PIN_DISP_* os_config.h'ta sabittir).

[env:esp32s3_18inch]
extends = env:esp32s3_wearable

; Driver seçimi tamamen `#ifdef`/`#ifndef DISPLAY_VARIANT_18INCH` guard'larıyla
; yapılır — herhangi bir CMake src exclude gerekmez:
;   - co5300_driver.cpp     : `#ifndef DISPLAY_VARIANT_18INCH` (1.8 env'de boş)
;   - sh8601_18_driver.cpp  : `#ifdef DISPLAY_VARIANT_18INCH` (sadece 1.8 env'de aktif)
; Linker her zaman tek `co5300_*` sembol set'i görür.
;
; 410x502 yerine 368x448 — co5300_driver.h #ifndef guard'ı respect eder.
build_flags =
    ${env:esp32s3_wearable.build_flags}
    -DCO5300_H_RES=368
    -DCO5300_V_RES=448
    -DDISPLAY_VARIANT_18INCH=1


; ============================================================
; Board Variant — ESP32-S3-Touch-LCD-1.28 (240x240)
; ============================================================
;
; TAMAMEN FARKLI BOARD: GC9A01A 1.28" yuvarlak LCD (1-bit SPI + DC pini),
; CST816S touch, PMIC yok, RTC yok, 2MB quad PSRAM, 16MB flash.
; Build:
;   pio run -e esp32s3_lcd128 -t upload
;
; Mevcut `esp32s3_wearable` (2.06" AMOLED) env'i tek satır değişmiyor —
; hangi env derlenirse firmware o board'da çalışır:
;   1. -DDISPLAY_VARIANT_LCD128 → co5300_driver.cpp boş TU olur,
;      gc9a01_128_driver.cpp aynı co5300_* API'sini sağlar.
;   2. -DBOARD_VARIANT_LCD128 → os_config.h pin haritasını
;      os_config_lcd128_pins.h'tan alır (I2C 6/7, SPI LCD 8-11/14, BL 2).
;   3. CO5300_H_RES/V_RES=240 → LVGL geometry + DMA buffer boyutları.
;   4. sdkconfig.esp32s3_lcd128 → quad PSRAM (2MB) + 16MB flash.
;      (default env octal 8MB PSRAM + 32MB flash kullanıyor)
;
; Boot notu: AXP2101/PCF85063/FT3168 probe'ları bu board'da fail olur —
; main.cpp hepsini warning ile tolere ediyor, boot display'e kadar gelir.

[env:esp32s3_lcd128]
extends = env:esp32s3_wearable

; 2MB quad PSRAM (default env: 8MB octal). Asıl konfig sdkconfig.esp32s3_lcd128
; içinde (CONFIG_SPIRAM_MODE_QUAD); bu satır board manifest tutarlılığı için.
board_build.psram_type = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Session 35: galeri görsel paketi için 8 MB sonrasında ek bölüm. İlk 8 MB
; partitions_custom.csv ile birebir aynı (ofsetler değişmedi).
board_build.partitions = partitions_lcd128.csv

; Bu board'un USB-UART köprüsü 921600'de stub upload checksum hatası veriyor
; ("Failed to write to target RAM") — 460800 güvenilir.
upload_speed = 460800

build_flags =
    ${env:esp32s3_wearable.build_flags}
    -DCO5300_H_RES=240
    -DCO5300_V_RES=240
    -DDISPLAY_VARIANT_LCD128=1
    -DBOARD_VARIANT_LCD128=1
    ; Backend (OTA + store + telemetry) — Mac'in ev ağındaki güncel IP'si.
    ; DİKKAT: DHCP lease yenilenince Mac IP'si değişebiliyor (108→70→194,
    ; 2026-07-20/21, bir günde 3 IP!) — rapor akışı durursa önce bunu doğrula.
    ; Kalıcı çözüm: router'da Mac'e statik DHCP rezervasyonu (kullanıcı yapacak).
    '-DOTA_BACKEND_HOST="http://192.168.1.50:3001"'
    ; GPS/GNSS modülü (UART1, NMEA). Header'daki boş pinler: 17 (RX←GPS TX), 18 (TX→GPS RX).
    ; Modül farklı pine takılırsa burayı değiştir; baud çoğu modülde 9600.
    -DGPS_UART_RX=17
    -DGPS_UART_TX=18
    -DGPS_UART_BAUD=9600
    -DTRACKER_FEATURES=1
    ; GPS güç/EN pini (dinlenme modunda kapatmak için). Modülde yoksa -1 → yalnız okuma durur.
    -DGPS_EN_PIN=-1


; ============================================================
; Board Variant — NAR-ESP32S3 development board (Corezzle)
; ============================================================
;
; Kendi SiP paketimiz (ESP32S3-PAKET1): ESP32-S3R16V (16 MB octal PSRAM,
; 1.8 V) + 32 MB GD25LQ256 flash (1.8 V) + AXP2101 + ES8311 + ES7210 +
; ICM42670. Ekran/dokunmatik/SD/buton/PA pinleri AMOLED 2.06 referans kartıyla aynı →
; pin haritası os_config.h'taki 2.06 haritası. Farklar:
;   1. RTC (PCF85063) YOK → -DBOARD_VARIANT_NAR: init atlanır, iç saat + NVS.
;   2. UART0 (TX/RX) NAR-IOT-LTE modülüne bağlı → konsol YALNIZ USB-Serial-JTAG
;      (sdkconfig.nar_esp32s3). Loglar modemin UART'ına basılmaz.
;   3. 32 MB flash; esptool stub bu flash'a yazamıyor (MD5 / "region is empty")
;      → ROM yükleyici (--no-stub).
; Build / yükle:
;   pio run -e nar_esp32s3 -t upload -t monitor --upload-port /dev/cu.usbmodem…

[env:nar_esp32s3]
extends = env:esp32s3_wearable

board_build.partitions = partitions_nar.csv
board_build.flash_size = 32MB
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432

upload_flags = --no-stub

build_flags =
    ${env:esp32s3_wearable.build_flags}
    -DBOARD_VARIANT_NAR=1
    -DCO5300_QUAD_PIXELS=0
    ; Takip (tasma) servisleri: telemetri, aktivite, komut arayüzü (USB-JTAG), piezo
    -DTRACKER_FEATURES=1
    -DGPS_ENABLED=0          ; GPS modülü takılı değil; UART1 pinleri (17/18) işgal edilmez
    -DENABLE_CAN=1           ; ham CAN (TWAI, yalnız alıcı). Padler: GPIO4 = CTX, GPIO5 = CRX (ekran D0/D1;
    -DPIN_CAN_TX=4           ; tasmada ekran yok, pinler ekran init'inden SONRA devralınır — twai_driver).
    -DPIN_CAN_RX=5           ; Dış transceiver (SN65HVD230 3.3 V) ŞART: pad4→CTX, pad5→CRX. 0 → yalnız `can inject`.
    -DPIEZO_PIN=6            ; DFRobot piezo (D modu, dijital darbe). GPIO6 = ekran D2 hattı; tasmada ekran YOK,
                             ; pin ekran init'inden SONRA giriş yapılır (vibration_service). 17 = SDCS, pull-up -> uygun değil
    '-DOTA_BACKEND_HOST="http://192.168.1.50:3001"'
